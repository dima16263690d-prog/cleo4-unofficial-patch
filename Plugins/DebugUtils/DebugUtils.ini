; CLEO 4 DebugUtils configuration
; Compact logging: lifecycle and anomalies are logged by default.
; Opcode tracing stays off unless explicitly enabled for focused analysis.

[DebugUtils.ScriptLog]
Enabled=1
OpcodeTrace=0
FunctionTrace=0
Deduplicate=1

[DebugUtils.Limits]
Command=0
Time=0

[DebugUtils.Logs]
Memory=0
MemoryTrace=0
Diagnostic=0

[DebugUtils.General]
LegacyDebugOpcodes=0

[DebugUtils.Crash]
; Heavy forensic work is crash-only. Normal gameplay stays lightweight.
CrashOnly=1
; Main crash capture/test switch.
Enabled=1
; Show the interactive crash window after the report is written.
Window=1
; Capture and print the EBP backtrace.
Backtrace=1
; Keep opcode history in the core log during a crash.
OpcodeHistory=0
; Maximum backtrace frames.
MaxFrames=32
