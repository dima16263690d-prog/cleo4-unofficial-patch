; CLEO 4 DebugUtils configuration
; Compact logging: lifecycle and anomalies are logged by default.
; Opcode tracing stays off unless explicitly enabled for focused analysis.

[DebugUtils.ScriptLog]
Enabled=1
OpcodeTrace=0
FunctionTrace=0
Deduplicate=1

[DebugUtils.FrameTime]
; Frame-time / stutter monitor. Samples the frame period and the logic-tick
; duration and writes cleo_frametime.log (its own file, so the other logs stay
; clean). Turn this on to find what to optimise for freezes: period_ms vs
; logic_ms separates "the whole frame was slow" (streaming/driver/render) from
; "the logic tick was slow" (scripts). Off by default; when off no clock is read.
Enabled=0
; Seconds between reports. Counters reset each interval.
Interval=10
; A frame period at or above this many ms counts as a stutter event.
WarnMs=50
; How many worst frames to list per report (1..32).
TopStutter=15
; Emit a frame-period histogram per report.
Histogram=1
; Also snapshot CStreaming memory each frame (ms_memoryUsed / ms_memoryAvailable)
; so stutters can be checked against streaming pressure. GTA SA 1.0 only.
Streaming=1
; Skip further samples once cleo_frametime.log exceeds this many MB.
MaxLogMB=16

[DebugUtils.Limits]
Command=0
Time=0

[DebugUtils.Logs]
Memory=1
MemoryTrace=0
; Dump resident memory per loaded module (with deltas) so growth that is not
; CLEO's own can be traced to a specific DLL.
ModuleMemoryMap=0
; Seconds between module memory dumps.
ModuleMemoryMapInterval=30
Diagnostic=0

[DebugUtils.General]
; Crash window + CrashInfo language: en or ru.
; Untranslated CrashInfo entries fall back to the English baseline.
Language=en
LegacyDebugOpcodes=0

[DebugUtils.Profiler]
; Per-script execution time and opcode measurement.
; Enabling this also turns on the core opcode observer, so per-opcode counts,
; opcode tracing and the hang-guard become live. Reports go to
; cleo_diagnostic.log when Diagnostic=1; otherwise a compact summary is
; mirrored to cleo_core.log so the numbers are never lost.
Enabled=0
; Seconds between reports. Per-script counters reset each interval, so every
; report describes exactly the interval it closes.
Interval=60
; How many top scripts (ranked by self time) to print per report.
Top=20
; Time the profiler's own opcode instrumentation (two QPC reads per opcode) and
; add a net_ms column that excludes it. Off by default.
Overhead=0
; How many hot opcodes (by execution count) to list per report. 0 = no list.
TopOpcodes=15

[DebugUtils.Crash]
; Main crash capture/test switch.
Enabled=1
; Show the interactive crash window after the report is written.
Window=1
; Use StackWalk64 for the crash backtrace.
Backtrace=1
; Keep extended opcode history only when explicitly enabled.
OpcodeHistory=0
; Maximum backtrace frames.
MaxFrames=32
