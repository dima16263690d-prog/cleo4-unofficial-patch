; language=en
; CLEO 4 DebugUtils configuration
; Compact logging: lifecycle and anomalies are logged by default.
; Opcode tracing stays off unless explicitly enabled for focused analysis.
; Comments are localized: set Language (below) to en or ru and restart the game
; to rewrite this file with the descriptions in that language, keeping values.

[DebugUtils.ScriptLog]
Enabled=1
OpcodeTrace=0
FunctionTrace=0
Deduplicate=1

[DebugUtils.FrameTime]
; Frame-time / stutter monitor. Samples the frame period and the logic-tick
; duration and writes cleo_frametime.log (its own file, so the other logs stay
; clean). Turn this on to find what to optimise for freezes: period_ms vs
; logic_ms separates "the whole frame was slow" (streaming/driver/render) from
; "the logic tick was slow" (scripts). Off by default; when off no clock is read.
Enabled=0
; Seconds between reports. Counters reset each interval.
Interval=10
; A frame period at or above this many ms counts as a stutter event.
WarnMs=50
; How many worst frames to list per report (1..32).
TopStutter=15
; Emit a frame-period histogram per report.
Histogram=1
; Also snapshot CStreaming memory each frame (ms_memoryUsed / ms_memoryAvailable)
; so stutters can be checked against streaming pressure. GTA SA 1.0 only.
Streaming=1
; Requested streaming budget (CStreaming::ms_memoryAvailable), in MB.
;   0 = leave the value the game / another mod set (default);
;  -1 = auto: 1024 MB with Large Address Aware, else 512 MB;
;  >0 = that many MB. Only ever raised, never lowered. GTA SA 1.0 only.
; Handy for an A/B test: leave 0 for one run, set -1 for the next, no rebuild.
StreamLimitMB=0
; Skip further samples once cleo_frametime.log exceeds this many MB.
MaxLogMB=16
; Warn when the interval's average FPS falls below this (0 = off).
MinFps=0
; Warn when the interval's 1%-low FPS falls below this (0 = off).
LowFpsWarn=0
; Warn when the interval's 0.1%-low FPS falls below this (long hitches; 0 = off).
LowFpsWarn01=0
; Warn when the average FPS is below MinFps for this many consecutive intervals
; (0 = off; needs MinFps > 0). One slow interval is noise; a run is a regression.
SustainedLowIntervals=0
; Frame budget in ms (0 = off). The report then states what share of the
; interval's frames met it, i.e. whether the target FPS was actually held.
FrameBudgetMs=0

[DebugUtils.Errors]
; RenderWare and CLEO error diagnostics, reported in cleo_frametime.log.
; OFF by default: the RenderWare poll runs every frame and costs a little, so
; turn it on (1) when you are hunting errors.
; Enabled: 1 = keep the error report, 0 = off.
Enabled=0
; Poll RenderWare's last error once per frame. Read-only and transparent: the
; error is read and put straight back, so the game's own error handling is
; unaffected. Names common errors and the RenderWare core plugin's errors
; (e.g. E_RW_READTEXMASK) and prints each error's meaning; errors from other
; plugins are shown as pluginID + raw code. GTA SA 1.0 US only. 1 = on, 0 = off.
RenderWare=0
; Scan the stack at the moment a CLEO/RenderWare error is raised and name the
; first module that is neither the game, the core, nor DebugUtils. That module
; (mod/plugin/loader) is the suspect behind the error. 1 = on, 0 = off.
ModuleScan=0
; Capture RenderWare file opens and print the exact path that failed to open.
; This is what turns E_RW_BADOPEN / E_RW_READTEXMASK from "some texture failed"
; into "models\foo.txd failed". Data-only patch (a pointer in RenderWare's file
; function table is swapped, no code is modified), so it is safe to leave on
; while hunting. GTA SA 1.0 US only. 1 = on, 0 = off.
FileWatch=0
; Print the "failed file opens" block (the files behind E_RW_BADOPEN /
; E_RW_READTEXMASK). 1 = on, 0 = off. An empty FileWatchNames does NOT silence
; this block; set FileWatchFailures=0 to stop it.
FileWatchFailures=1
; Comma-separated path masks. Every open of a matching file is logged - success
; or failure - so "who loads particle.txd" is answered even when the file exists.
; Each entry is a substring, a glob mask (* and ?), or a bare name:
;   particle.txd     one specific file
;   *.txd            any .txd (all texture dictionaries)
;   lunar.png        a specific missing texture
;   *.png, *.dff     several kinds at once
; Example: FileWatchNames=particle.txd,*.png
FileWatchNames=
; Capture RenderWare texture reads and print the mod that caused
; E_RW_READTEXMASK ("Unable to read Texture/Mask"). The error is raised by
; RwTextureRead's read callback; unlike the error poll (one frame later, when the
; raising stack is gone) this fires inside the read, so the mod's frame is still
; on the stack and gets named. Data-only patch (the callback and the RwGlobals
; stdFunc[26] pointer are swapped, no code is modified), same safety model as
; FileWatch. GTA SA 1.0 US only. 1 = on, 0 = off.
TextureWatch=0

[DebugUtils.Limits]
Command=0
Time=0

[DebugUtils.Logs]
Memory=1
MemoryTrace=0
; Dump resident memory per loaded module (with deltas) so growth that is not
; CLEO's own can be traced to a specific DLL.
ModuleMemoryMap=0
; Seconds between module memory dumps.
ModuleMemoryMapInterval=30
; Per-script memory-leak tracker. Samples the CLEO script-memory arena
; (allocate_memory 0AC8) per script and reports each script's growth, its share
; of the arena and of the process in %, and a verdict (LEAK / SUSPECTED /
; STABLE / RELEASED). Off by default: it allocates and samples on a timer.
LeakTracker=0
; Seconds between leak-tracker samples (>=5).
LeakInterval=30
; Growth below this many KB is ignored when classifying a script.
LeakMinGrowthKB=64
Diagnostic=0

[DebugUtils.General]
; Crash window + CrashInfo language: en or ru.
; Untranslated CrashInfo entries fall back to the English baseline.
Language=en
LegacyDebugOpcodes=0

[DebugUtils.Profiler]
; Per-script execution time and opcode measurement.
; Enabling this also turns on the core opcode observer, so per-opcode counts,
; opcode tracing and the hang-guard become live. Reports go to
; cleo_diagnostic.log when Diagnostic=1; otherwise a compact summary is
; mirrored to cleo_core.log so the numbers are never lost.
Enabled=0
; Seconds between reports. Per-script counters reset each interval, so every
; report describes exactly the interval it closes.
Interval=60
; How many top scripts (ranked by self time) to print per report.
Top=20
; Time the profiler's own opcode instrumentation (two QPC reads per opcode) and
; add a net_ms column that excludes it. Off by default.
Overhead=0
; How many hot opcodes (by execution count) to list per report. 0 = no list.
TopOpcodes=15

[DebugUtils.Crash]
; Main crash capture/test switch.
Enabled=1
; Show the interactive crash window after the report is written.
Window=1
; Use StackWalk64 for the crash backtrace.
Backtrace=1
; Keep extended opcode history only when explicitly enabled.
OpcodeHistory=0
; Maximum backtrace frames.
MaxFrames=32
