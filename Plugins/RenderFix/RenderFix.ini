; CLEO 4 RenderFix configuration
; Opt-in frame-pacing and renderer tweaks for GTA San Andreas 1.0 US.
;
; RenderFix is the "fixer" companion to DebugUtils: DebugUtils reports what is
; wrong, RenderFix optionally changes frame pacing / streaming. Every tweak is
; off by default and applied at game start, so you can enable one at a time and
; see exactly what each does. All addresses are 1.0 US specific; on any other
; game build the plugin logs that it did nothing and applies no patches.

[RenderFix.General]
; Master switch. 0 = the plugin does nothing at all.
Enabled=0
; Write cleo\debug\cleo_renderfix.log. 1 = on.
Log=1

[RenderFix.FPS]
; Frame-rate cap in FPS.
;   0 = leave the value the game / another mod set (default);
;  1..255 = cap the frame rate at this many FPS.
; Note: this only changes the limiter value. Gameplay above 30 FPS may expose
; physics/timing issues the engine was not designed for - test before keeping.
FrameLimit=0
; Remove the engine's ~14 ms per-frame delay (SilentPatch's "No framedelay").
; This is what usually unlocks a smooth high frame rate. 1 = remove, 0 = off.
RemoveFrameDelay=0

[RenderFix.Streaming]
; Streaming memory budget (CStreaming::ms_memoryAvailable), in MB.
;   0 = leave the value the game / another mod set (default);
;  -1 = auto: 1024 MB with Large Address Aware, else 512 MB;
;  >0 = that many MB.
; Handed to the CLEO core and applied at SCM init; only ever raised, never
; lowered. Helps with texture/model streaming stutter at high frame rates.
MemoryMB=0
