// Audio.cleo extended opcodes
2500=1,is_audio_stream_playing %1d%
2501=2,%2d% = get_audiostream_duration %1d%
2502=2,%2d% = get_audio_stream_speed %1d%
2503=2,set_audio_stream_speed %1d% speed %2d%
2504=3,set_audio_stream_volume_with_transition %1d% volume %2d% time_ms %3d%
2505=3,set_audio_stream_speed_with_transition %1d% speed %2d% time_ms %3d%
2506=2,set_audio_stream_source_size %1d% radius %2d%
2507=2,%2d% = get_audio_stream_progress %1d%
2508=2,set_audio_stream_progress %1d% %2d%
2509=2,%2d% = get_audio_stream_type %1d%
250A=2,set_audio_stream_type %1d% type %2d%
250B=2,%2d% = get_audio_stream_progress_seconds %1d%
250C=2,set_audio_stream_progress_seconds %1d% %2d%
250D=2,set_audio_stream_looping %1d% enable %2d%
